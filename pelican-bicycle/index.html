<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · 三厂对决 — Pelican Bicycle Showdown</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#05010f; --line:rgba(255,255,255,.1); --dim:#8b8aa8; --faint:#555274; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(ellipse at top, #150833 0%, #05010f 60%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  h1 {
    font-size: 16px; font-weight: 800; letter-spacing: 1px; white-space: nowrap;
    background: linear-gradient(135deg, #b18cff, #5ff0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .en { font-size: 10px; letter-spacing: 2px; color: var(--faint); display: block; -webkit-text-fill-color: var(--faint); font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    --ac: #5ff0ff;
    appearance: none; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.03); color: var(--dim);
    padding: 6px 16px; white-space: nowrap; text-align: center;
    transition: border-color .2s, box-shadow .2s, background .2s, color .2s;
  }
  .tab b { display: block; font-size: 13px; color: #fff; letter-spacing: .5px; }
  .tab small { display: block; font-size: 9px; letter-spacing: 1px; opacity: .75; margin-top: 1px; }
  .tab:hover { border-color: var(--ac); }
  .tab.on { color: #fff; border-color: var(--ac); background: rgba(255,255,255,.06); box-shadow: 0 0 18px -6px var(--ac); }
  .hint { font-size: 10px; color: var(--faint); letter-spacing: 1px; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
  @media (max-width: 640px) {
    header { gap: 10px; padding: 8px 10px; }
    h1 { font-size: 14px; }
    .tabs { margin-left: 0; width: 100%; order: 3; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>鹈鹕骑车<span class="en">PELICAN BICYCLE SHOWDOWN</span></h1>
    <nav class="tabs" id="tabs" aria-label="选择版本"></nav>
    <span class="hint">按 1 / 2 / 3 切换</span>
  </header>
  <iframe id="stage" title="pelican bicycle demo"></iframe>
  <script>
    const VERSIONS = [
      { key: "mcode",  label: "mcode",       sub: "mcode + GLM-5.3",  src: "mcode/pelican-bicycle.html",  ac: "#5ff0ff" },
      { key: "claude", label: "Claude Code", sub: "claude + GLM-5.3", src: "claude/pelican-bicycle.html", ac: "#ff5af7" },
      { key: "codex",  label: "Codex",       sub: "codex + GLM-5.3",  src: "codex/pelican-bike.html",     ac: "#b18cff" }
    ];
    const tabs = document.getElementById("tabs");
    const stage = document.getElementById("stage");
    VERSIONS.forEach((v, i) => {
      const b = document.createElement("button");
      b.className = "tab";
      b.style.setProperty("--ac", v.ac);
      b.innerHTML = "<b>" + v.label + "</b><small>" + v.sub + "</small>";
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => select(v.key));
      b.dataset.key = v.key;
      tabs.appendChild(b);
    });
    function select(key) {
      const v = VERSIONS.find(x => x.key === key) || VERSIONS[0];
      tabs.querySelectorAll(".tab").forEach(t => {
        const on = t.dataset.key === v.key;
        t.classList.toggle("on", on);
        t.setAttribute("aria-pressed", on);
      });
      if (!stage.src.endsWith(v.src)) stage.src = v.src;
      if (location.hash !== "#" + v.key) history.replaceState(null, "", "#" + v.key);
      document.title = "鹈鹕骑车 · " + v.label + " — Pelican Bicycle Showdown";
    }
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const i = ["1", "2", "3"].indexOf(e.key);
      if (i >= 0) select(VERSIONS[i].key);
    });
    select((location.hash || "#mcode").slice(1));
  </script>
</body>
</html>
