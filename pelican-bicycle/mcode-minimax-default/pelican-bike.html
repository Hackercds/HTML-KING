<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:28px 20px;
    background:radial-gradient(1100px 620px at 50% -5%, #33465e 0%, #1b2634 58%, #0d131b 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    width:min(1080px,100%);
    border-radius:24px; overflow:hidden;
    box-shadow:0 34px 80px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.08) inset;
    background:#bfe6f7;
    line-height:0;
  }
  svg{ display:block; width:100%; height:auto; }
  .caption{ text-align:center; color:#cfdbe8; }
  .caption h1{ margin:0 0 6px; font-size:19px; font-weight:600; letter-spacing:.06em; color:#eaf3fb; }
  .caption p{ margin:0; font-size:13px; opacity:.62; letter-spacing:.04em; }

  /* ---------- CSS 驱动的背景 / 装饰动画 ---------- */

  @keyframes drift      { from{ transform:translateX(0) } to{ transform:translateX(-1200px) } }
  @keyframes hillsPan   { from{ transform:translateX(0) } to{ transform:translateX(-1200px) } }
  @keyframes treePan    { from{ transform:translateX(0) } to{ transform:translateX(-480px) } }
  @keyframes bushPan    { from{ transform:translateX(0) } to{ transform:translateX(-300px) } }
  @keyframes tuftPan    { from{ transform:translateX(0) } to{ transform:translateX(-260px) } }
  @keyframes roadPan    { from{ transform:translateX(0) } to{ transform:translateX(-170px) } }
  @keyframes fgPan      { from{ transform:translateX(0) } to{ transform:translateX(-340px) } }
  @keyframes sunPulse   { 0%,100%{ transform:scale(1); opacity:.85 } 50%{ transform:scale(1.06); opacity:1 } }
  @keyframes birdFlap   { 0%,100%{ transform:rotate(-16deg) } 50%{ transform:rotate(14deg) } }
  @keyframes fishWiggle { 0%,100%{ transform:rotate(-6deg) } 50%{ transform:rotate(6deg) } }
  @keyframes flagWave   { 0%,100%{ transform:skewY(-4deg) } 50%{ transform:skewY(5deg) } }

  /* transform-box 让 transform-origin 使用 viewBox 坐标，纯 CSS 也能做局部旋转/缩放 */
  #sunGlow      { transform-box:view-box; transform-origin:852px 96px;  animation:sunPulse 6s ease-in-out infinite; }
  #hillsFar     { animation:hillsPan 190s linear infinite; }
  #birds        { transform-box:view-box; transform-origin:180px 120px; }
  #birds .flap  { transform-box:view-box; }
  #birdA .flap  { transform-origin:180px 120px; animation:birdFlap .9s ease-in-out infinite; }
  #birdB .flap  { transform-origin:252px 92px;  animation:birdFlap 1.1s ease-in-out infinite; }
  #birdC .flap  { transform-origin:112px 168px; animation:birdFlap 1.3s ease-in-out infinite; }
  #cloudsA      { animation:drift 150s linear infinite; }
  #cloudsB      { animation:drift 108s linear infinite; }
  #trees        { animation:treePan 21s linear infinite; }
  #bushes       { animation:bushPan 7.4s linear infinite; }
  #tufts        { animation:tuftPan 1.95s linear infinite; }
  #roadDashes   { animation:roadPan 1.25s linear infinite; }
  #fgGrass      { animation:fgPan 1.25s linear infinite; }

  /* ---------- 鹈鹕自身的微动作 ---------- */

  #eye    { transform-box:view-box; transform-origin:538px 140px; animation:blink 5.4s infinite; }
  @keyframes blink{ 0%,91%,100%{ transform:scaleY(1) } 93%{ transform:scaleY(.08) } 95.5%{ transform:scaleY(1) } }

  #bill   { transform-box:view-box; transform-origin:554px 148px; animation:snap 9.5s ease-in-out infinite; }
  @keyframes snap{ 0%,83%{ transform:rotate(0deg) } 86%{ transform:rotate(-14deg) } 91%{ transform:rotate(-2deg) } 95%,100%{ transform:rotate(0deg) } }

  #pouch  { transform-box:view-box; transform-origin:556px 157px; animation:pouch 1.63s ease-in-out infinite; }
  @keyframes pouch{ 0%,100%{ transform:scale(1,1) } 50%{ transform:scale(1.015,1.05) } }

  #tail   { transform-box:view-box; transform-origin:374px 252px; animation:tail 2.6s ease-in-out infinite; }
  @keyframes tail{ 0%,100%{ transform:rotate(-2.2deg) } 50%{ transform:rotate(3deg) } }

  #wingNear{ transform-box:view-box; transform-origin:398px 230px; animation:wingNear 1.3s ease-in-out infinite; }
  @keyframes wingNear{ 0%,100%{ transform:rotate(1.5deg) } 50%{ transform:rotate(-1.5deg) } }

  #wingFar { transform-box:view-box; transform-origin:390px 240px; animation:wingFar 1.3s ease-in-out infinite; }
  @keyframes wingFar{ 0%,100%{ transform:rotate(-3.2deg) } 50%{ transform:rotate(1.8deg) } }

  #fish1   { transform-box:view-box; transform-origin:684px 288px; animation:fishWiggle 1.9s ease-in-out infinite; }
  #fish2   { transform-box:view-box; transform-origin:700px 284px; animation:fishWiggle 1.9s ease-in-out infinite .35s; }
  #pennant { transform-box:view-box; transform-origin:706px 268px; animation:flagWave 1.1s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    #cloudsA,#cloudsB,#hillsFar,#trees,#bushes{ animation-duration:600s !important; }
    #tufts,#roadDashes,#fgGrass{ animation-duration:4s !important; }
  }
</style>
</head>
<body>

<div class="frame">
<svg viewBox="0 0 1000 620" role="img" aria-label="一只鹈鹕骑着自行车在公路上行驶的二维动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7ec8ee"/>
      <stop offset="0.45" stop-color="#b6e3f7"/>
      <stop offset="1"    stop-color="#e9f8fd"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe082" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffdf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed36f"/>
      <stop offset="1" stop-color="#5fae51"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#5a6068"/>
      <stop offset="0.2" stop-color="#4d535b"/>
      <stop offset="1"   stop-color="#3b4048"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#fffdf7"/>
      <stop offset="0.6" stop-color="#fff7e9"/>
      <stop offset="1"   stop-color="#f0e2c9"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f7eddb"/>
      <stop offset="1"   stop-color="#e2d2b6"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0"   stop-color="#ffcf5c"/>
      <stop offset="0.7" stop-color="#ffb52e"/>
      <stop offset="1"   stop-color="#f79c1d"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0"   stop-color="#ffb066"/>
      <stop offset="1"   stop-color="#f5843c"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2bbfae"/>
      <stop offset="0.5" stop-color="#1b9a8c"/>
      <stop offset="1"   stop-color="#14776d"/>
    </linearGradient>
    <linearGradient id="hillFarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3a8"/>
      <stop offset="1" stop-color="#a5d793"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-160%" width="160%" height="420%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="cloudSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect x="0" y="0" width="1000" height="500" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <g id="sunGlow">
    <circle cx="852" cy="96" r="120" fill="url(#sunGrad)"/>
    <circle cx="852" cy="96" r="40" fill="#ffe9a3" opacity="0.9"/>
    <circle cx="852" cy="96" r="33" fill="#fff3c9"/>
  </g>

  <!-- 云（两层不同速度的视差） -->
  <g filter="url(#cloudSoft)" opacity="0.95">
    <g id="cloudsA" fill="#ffffff">
      <g transform="translate(-100 92) scale(1.05)">
        <ellipse cx="0" cy="0" rx="52" ry="24"/><ellipse cx="34" cy="6" rx="38" ry="19"/><ellipse cx="-32" cy="7" rx="34" ry="17"/>
        <ellipse cx="240" cy="-26" rx="44" ry="21"/><ellipse cx="268" cy="-14" rx="30" ry="15"/>
        <ellipse cx="560" cy="34" rx="60" ry="26"/><ellipse cx="604" cy="44" rx="40" ry="19"/><ellipse cx="512" cy="42" rx="36" ry="17"/>
        <ellipse cx="880" cy="-8" rx="50" ry="23"/><ellipse cx="912" cy="4" rx="32" ry="15"/>
        <ellipse cx="1200" cy="60" rx="46" ry="22"/><ellipse cx="1176" cy="68" rx="32" ry="16"/>
        <ellipse cx="1240" cy="90" rx="56" ry="24"/>
      </g>
    </g>
    <g id="cloudsB" fill="#ffffff" opacity="0.6">
      <g transform="translate(-100 170) scale(0.72)">
        <ellipse cx="0" cy="0" rx="48" ry="22"/><ellipse cx="30" cy="7" rx="32" ry="15"/>
        <ellipse cx="340" cy="18" rx="56" ry="24"/><ellipse cx="378" cy="28" rx="36" ry="16"/>
        <ellipse cx="700" cy="-16" rx="44" ry="20"/><ellipse cx="728" cy="-4" rx="30" ry="14"/>
        <ellipse cx="1200" cy="10" rx="50" ry="22"/><ellipse cx="1232" cy="20" rx="32" ry="15"/>
      </g>
    </g>
  </g>

  <!-- 远处飞鸟 -->
  <g id="birds" fill="none" stroke="#5f7387" stroke-width="3.2" stroke-linecap="round" opacity="0.5">
    <g id="birdA"><g class="flap"><path d="M168 122 q12 -10 12 0 q0 -10 12 0"/></g></g>
    <g id="birdB"><g class="flap"><path d="M240 94 q10 -9 10 0 q0 -9 10 0"/></g></g>
    <g id="birdC"><g class="flap"><path d="M100 170 q9 -8 9 0 q0 -8 9 0"/></g></g>
  </g>

  <!-- ================= 远山（最慢视差） ================= -->
  <g id="hillsFar">
    <g transform="translate(0 0)">
      <path fill="url(#hillFarGrad)" d="M-1200 500 L-1200 372 C-1120 320 -1050 348 -980 330 C-900 310 -850 356 -780 348 C-700 338 -640 300 -560 316 C-480 332 -430 372 -360 358 C-290 344 -230 312 -160 330 C-100 346 -60 372 0 364 L0 500 Z"/>
      <path fill="#c9e8b4" d="M0 500 L0 372 C60 350 110 336 180 342 C250 348 300 372 370 362 C440 352 490 318 560 328 C640 340 700 376 780 366 C860 356 920 322 1000 334 C1080 346 1140 378 1200 370 L1200 500 Z"/>
    </g>
  </g>

  <!-- 中景树（慢视差） -->
  <g id="trees">
    <g fill="#3f7f3c">
      <!-- -480 -->
      <g transform="translate(-480 500)">
        <rect x="-5" y="-46" width="10" height="48" rx="4" fill="#7a5b3c"/>
        <circle cx="0" cy="-66" r="30"/><circle cx="-24" cy="-50" r="20"/><circle cx="25" cy="-51" r="21"/>
      </g>
      <!-- 0 -->
      <g transform="translate(0 500)">
        <rect x="-6" y="-58" width="12" height="60" rx="4" fill="#7a5b3c"/>
        <circle cx="0" cy="-82" r="36"/><circle cx="-29" cy="-62" r="24"/><circle cx="30" cy="-63" r="25"/>
      </g>
      <!-- 480 -->
      <g transform="translate(480 500)">
        <rect x="-5" y="-40" width="10" height="42" rx="4" fill="#7a5b3c"/>
        <circle cx="0" cy="-58" r="26"/><circle cx="-21" cy="-44" r="17"/><circle cx="22" cy="-45" r="18"/>
      </g>
      <!-- 960 -->
      <g transform="translate(960 500)">
        <rect x="-6" y="-54" width="12" height="56" rx="4" fill="#7a5b3c"/>
        <circle cx="0" cy="-78" r="33"/><circle cx="-27" cy="-60" r="22"/><circle cx="28" cy="-61" r="23"/>
      </g>
    </g>
  </g>

  <!-- 草地 -->
  <rect x="0" y="430" width="1000" height="72" fill="url(#grassGrad)"/>
  <rect x="0" y="486" width="1000" height="16" fill="#4e9a45" opacity="0.55"/>

  <!-- 近景灌木（中速视差） -->
  <g id="bushes">
    <g fill="#57a84a">
      <g transform="translate(-300 500)"><ellipse cx="0" cy="-10" rx="34" ry="16"/><ellipse cx="-24" cy="-18" rx="22" ry="14"/><ellipse cx="26" cy="-16" rx="20" ry="12"/></g>
      <g transform="translate(0 500)"><ellipse cx="0" cy="-8" rx="30" ry="15"/><ellipse cx="-22" cy="-16" rx="20" ry="13"/><ellipse cx="24" cy="-15" rx="19" ry="12"/></g>
      <g transform="translate(300 500)"><ellipse cx="0" cy="-12" rx="36" ry="17"/><ellipse cx="-26" cy="-20" rx="23" ry="15"/><ellipse cx="28" cy="-18" rx="21" ry="13"/></g>
      <g transform="translate(600 500)"><ellipse cx="0" cy="-9" rx="31" ry="15"/><ellipse cx="-23" cy="-17" rx="21" ry="13"/><ellipse cx="25" cy="-16" rx="20" ry="12"/></g>
      <g transform="translate(900 500)"><ellipse cx="0" cy="-11" rx="33" ry="16"/><ellipse cx="-25" cy="-19" rx="22" ry="14"/><ellipse cx="27" cy="-17" rx="20" ry="13"/></g>
      <g transform="translate(1200 500)"><ellipse cx="0" cy="-8" rx="30" ry="15"/><ellipse cx="-22" cy="-16" rx="20" ry="13"/><ellipse cx="24" cy="-15" rx="19" ry="12"/></g>
    </g>
    <g fill="#6cbb58" opacity="0.75">
      <circle cx="-24" cy="-24" r="4"/><circle cx="8" cy="-22" r="3.4"/><circle cx="276" cy="-26" r="4"/><circle cx="608" cy="-24" r="4"/><circle cx="906" cy="-25" r="4"/>
    </g>
  </g>

  <!-- 草丛（与地面同速） -->
  <g id="tufts" stroke="#4e9a45" stroke-width="3.2" stroke-linecap="round" fill="none">
    <g opacity="0.9">
      <path d="M-260 500 q3 -16 -1 -26"/><path d="M-253 500 q6 -18 4 -28"/><path d="M-246 500 q9 -14 12 -24"/>
      <path d="M-60 500 q3 -18 -2 -28"/><path d="M-52 500 q7 -20 5 -30"/><path d="M-44 500 q10 -15 14 -25"/>
      <path d="M140 500 q3 -16 -1 -26"/><path d="M148 500 q6 -18 4 -28"/><path d="M156 500 q9 -14 12 -24"/>
      <path d="M340 500 q3 -18 -2 -28"/><path d="M348 500 q7 -20 5 -30"/><path d="M356 500 q10 -15 14 -25"/>
      <path d="M540 500 q3 -16 -1 -26"/><path d="M548 500 q6 -18 4 -28"/><path d="M556 500 q9 -14 12 -24"/>
      <path d="M740 500 q3 -18 -2 -28"/><path d="M748 500 q7 -20 5 -30"/><path d="M756 500 q10 -15 14 -25"/>
      <path d="M940 500 q3 -16 -1 -26"/><path d="M948 500 q6 -18 4 -28"/><path d="M956 500 q9 -14 12 -24"/>
      <path d="M1140 500 q3 -18 -2 -28"/><path d="M1148 500 q7 -20 5 -30"/><path d="M1156 500 q10 -15 14 -25"/>
    </g>
  </g>

  <!-- ================= 路面 ================= -->
  <rect x="0" y="500" width="1000" height="120" fill="url(#roadGrad)"/>
  <rect x="0" y="500" width="1000" height="6" fill="#e9eef2" opacity="0.9"/>
  <rect x="0" y="508" width="1000" height="4" fill="#22262c" opacity="0.35"/>
  <g id="roadDashes" fill="#f7d774" opacity="0.92">
    <rect x="-170" y="574" width="100" height="11" rx="5"/>
    <rect x="0"    y="574" width="100" height="11" rx="5"/>
    <rect x="170"  y="574" width="100" height="11" rx="5"/>
    <rect x="340"  y="574" width="100" height="11" rx="5"/>
    <rect x="510"  y="574" width="100" height="11" rx="5"/>
    <rect x="680"  y="574" width="100" height="11" rx="5"/>
    <rect x="850"  y="574" width="100" height="11" rx="5"/>
    <rect x="1020" y="574" width="100" height="11" rx="5"/>
  </g>
  <g fill="#000" opacity="0.10">
    <rect x="-120" y="536" width="54" height="5" rx="2.5"/><rect x="260" y="536" width="54" height="5" rx="2.5"/>
    <rect x="640" y="536" width="54" height="5" rx="2.5"/><rect x="1020" y="536" width="54" height="5" rx="2.5"/>
  </g>

  <!-- 地面投影（随车身起伏缩放） -->
  <ellipse id="groundShadow" cx="504" cy="512" rx="152" ry="13" fill="#1a1d22" opacity="0.26" filter="url(#softShadow)"/>

  <!-- 前景草（最快，制造景深） -->
  <g id="fgGrass" stroke="#2f6b2c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M-340 620 q6 -34 0 -52"/><path d="M-326 620 q12 -40 8 -58"/><path d="M-312 620 q16 -32 24 -50"/>
    <path d="M-80 620 q6 -32 0 -50"/><path d="M-66 620 q12 -38 8 -56"/><path d="M-52 620 q16 -30 24 -48"/>
    <path d="M180 620 q6 -34 0 -52"/><path d="M194 620 q12 -40 8 -58"/><path d="M208 620 q16 -32 24 -50"/>
    <path d="M440 620 q6 -32 0 -50"/><path d="M454 620 q12 -38 8 -56"/><path d="M468 620 q16 -30 24 -48"/>
    <path d="M700 620 q6 -34 0 -52"/><path d="M714 620 q12 -40 8 -58"/><path d="M728 620 q16 -32 24 -50"/>
    <path d="M960 620 q6 -32 0 -50"/><path d="M974 620 q12 -38 8 -56"/><path d="M988 620 q16 -30 24 -48"/>
  </g>

  <!-- ================= 骑手（自行车 + 鹈鹕） ================= -->
  <g id="rider">

    <!-- ---------- 自行车 ---------- -->
    <g id="bike" stroke-linecap="round" stroke-linejoin="round">

      <!-- 后轮 -->
      <g id="rearWheel">
        <circle cx="368" cy="442" r="58" fill="none" stroke="#2f3742" stroke-width="10"/>
        <circle cx="368" cy="442" r="49" fill="none" stroke="#e3ebf0" stroke-width="6"/>
        <g id="rearSpin" stroke="#b6c2cc" stroke-width="2.6" fill="none">
          <line x1="368" y1="393" x2="368" y2="491"/>
          <line x1="393" y1="399.7" x2="343" y2="484.3"/>
          <line x1="411.3" y1="417" x2="324.7" y2="467"/>
          <line x1="417" y1="442" x2="319" y2="442"/>
          <line x1="411.3" y1="467" x2="324.7" y2="417"/>
          <line x1="393" y1="484.3" x2="343" y2="399.7"/>
        </g>
        <circle cx="368" cy="442" r="9" fill="#94a3af"/><circle cx="368" cy="442" r="3.6" fill="#5f6d79"/>
      </g>

      <!-- 前轮 -->
      <g id="frontWheel">
        <circle cx="640" cy="442" r="58" fill="none" stroke="#2f3742" stroke-width="10"/>
        <circle cx="640" cy="442" r="49" fill="none" stroke="#e3ebf0" stroke-width="6"/>
        <g id="frontSpin" stroke="#b6c2cc" stroke-width="2.6" fill="none">
          <line x1="640" y1="393" x2="640" y2="491"/>
          <line x1="665" y1="399.7" x2="615" y2="484.3"/>
          <line x1="683.3" y1="417" x2="596.7" y2="467"/>
          <line x1="689" y1="442" x2="591" y2="442"/>
          <line x1="683.3" y1="467" x2="596.7" y2="417"/>
          <line x1="665" y1="484.3" x2="615" y2="399.7"/>
        </g>
        <circle cx="640" cy="442" r="9" fill="#94a3af"/><circle cx="640" cy="442" r="3.6" fill="#5f6d79"/>
      </g>

      <!-- 车架 -->
      <g stroke="url(#frameGrad)" stroke-width="11" fill="none">
        <path d="M504 442 L368 442"/>          <!-- 后下叉 -->
        <path d="M455 330 L368 442"/>          <!-- 后上叉 -->
        <path d="M504 442 L452 322"/>          <!-- 座管 -->
        <path d="M452 326 L610 358"/>          <!-- 上管 -->
        <path d="M504 442 L600 386"/>          <!-- 下管 -->
        <path d="M604 388 L610 354"/>          <!-- 头管 -->
      </g>
      <!-- 前叉 -->
      <g stroke="url(#frameGrad)" stroke-width="10" fill="none">
        <path d="M604 386 Q612 414 640 442"/>
        <path d="M610 356 Q622 400 640 442"/>
      </g>

      <!-- 链条 -->
      <path d="M368 434 L504 434" stroke="#6d7883" stroke-width="4" fill="none"/>
      <path d="M368 450 L504 450" stroke="#6d7883" stroke-width="4" fill="none"/>
      <circle cx="368" cy="442" r="8" fill="none" stroke="#6d7883" stroke-width="3.5"/>
      <circle cx="504" cy="442" r="17" fill="none" stroke="#8a95a1" stroke-width="4.5"/>
      <g stroke="#8a95a1" stroke-width="2.4" fill="none">
        <line x1="504" y1="425" x2="504" y2="459"/><line x1="487" y1="442" x2="521" y2="442"/>
        <line x1="492" y1="430" x2="516" y2="454"/><line x1="516" y1="430" x2="492" y2="454"/>
      </g>

      <!-- 车座 -->
      <path d="M424 316 C424 306 436 302 452 304 C470 306 482 310 484 318 C485 324 478 328 468 328 L432 328 C427 328 424 323 424 316 Z" fill="#ff7043"/>
      <path d="M428 312 C436 307 452 306 466 308" stroke="#ffa07a" stroke-width="3" fill="none"/>

<div class="caption">
  <h1>鹈鹕骑行中</h1>
  <p>纯 SVG 绘制 · CSS 视差 + JavaScript 腿部 IK 踩踏联动</p>
</div>

<script>
(function () {
  'use strict';

  // ---------- 骑行机构的关键坐标（单位：viewBox px） ----------
  var CRANK   = { x: 504, y: 442 };   // 曲柄中心（五通）
  var R       = 22;                   // 曲柄半径（踏板绕圈半径）
  var HIP     = { x: 452, y: 300 };   // 髋关节（藏在身体里）
  var L1      = 95;                   // 大腿长度
  var L2      = 90;                   // 小腿长度
  var GEAR    = 1.0;                  // 车轮 / 曲柄 传动比
  var FRONT   = { x: 640, y: 442 };   // 前轮轴（旋转中心）

  var el = {
    rider:        document.getElementById('rider'),
    shadow:       document.getElementById('groundShadow'),
    rearSpin:     document.getElementById('rearSpin'),
    frontSpin:    document.getElementById('frontSpin'),
    crankArmNear: document.getElementById('crankArmNear'),
    crankArmFar:  document.getElementById('crankArmFar'),
    pedalNear:    document.getElementById('pedalNear'),
    pedalFar:     document.getElementById('pedalFar'),
    nearLegPath:  document.getElementById('nearLegPath'),
    farLegPath:   document.getElementById('farLegPath'),
    nearKnee:     document.getElementById('nearKnee'),
    farKnee:      document.getElementById('farKnee'),
    footNear:     document.getElementById('footNear'),
    footFar:      document.getElementById('footFar'),
    headRig:      document.getElementById('headRig')
  };

  // ---------- 两骨 IK：求膝关节位置 ----------
  // 返回"向前弯"的解，看起来像在蹬车（而不是鸟腿的后折）
  function solveKnee(hx, hy, fx, fy) {
    var dx = fx - hx, dy = fy - hy;
    var d  = Math.sqrt(dx * dx + dy * dy);
    var maxD = (L1 + L2) * 0.995;
    var minD = Math.abs(L1 - L2) + 0.01;
    d = Math.min(maxD, Math.max(minD, d));

    var base = Math.atan2(dy, dx);
    var a    = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h    = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var off  = Math.atan2(h, a);

    var kA = { x: hx + Math.cos(base - off) * L1, y: hy + Math.sin(base - off) * L1 };
    var kB = { x: hx + Math.cos(base + off) * L1, y: hy + Math.sin(base + off) * L1 };
    return kA.x >= kB.x ? kA : kB;   // 取更靠前（+x）的一侧
  }

  function setLeg(pathEl, kneeEl, footEl, phase, hip) {
    var fx = CRANK.x + R * Math.cos(phase);
    var fy = CRANK.y + R * Math.sin(phase);
    var k  = solveKnee(hip.x, hip.y, fx, fy);

    pathEl.setAttribute('d',
      'M' + hip.x.toFixed(1) + ' ' + hip.y.toFixed(1) +
      ' L' + k.x.toFixed(1)   + ' ' + k.y.toFixed(1) +
      ' L' + fx.toFixed(1)    + ' ' + fy.toFixed(1));
    kneeEl.setAttribute('cx', k.x.toFixed(1));
    kneeEl.setAttribute('cy', k.y.toFixed(1));
    footEl.setAttribute('transform', 'translate(' + fx.toFixed(1) + ' ' + (fy - 5).toFixed(1) + ')');
  }

  var t0 = null;
  function frame(ts) {
    if (t0 === null) t0 = ts;
    var T = (ts - t0) / 1000;

    // 缓慢悠哉的踏频（带一点自然的呼吸感起伏）
    var cadence = 0.38 + 0.022 * Math.sin(T * (Math.PI * 2 / 11));
    var ang = T * cadence * Math.PI * 2;           // 弧度，顺时针（前进方向）
    var deg = ang * 180 / Math.PI;

    // 车轮转动
    el.rearSpin.setAttribute('transform',  'rotate(' + (deg * GEAR).toFixed(2) + ' 368 442)');
    el.frontSpin.setAttribute('transform', 'rotate(' + (deg * GEAR).toFixed(2) + ' ' + FRONT.x + ' ' + FRONT.y + ')');

    // 曲柄 + 踏板（两侧相差 180°）
    var px = CRANK.x + R * Math.cos(ang);
    var py = CRANK.y + R * Math.sin(ang);
    el.crankArmNear.setAttribute('x2', px.toFixed(1));
    el.crankArmNear.setAttribute('y2', py.toFixed(1));
    el.pedalNear.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ')');
    el.crankArmFar.setAttribute('x2', (2 * CRANK.x - px).toFixed(1));
    el.crankArmFar.setAttribute('y2', (2 * CRANK.y - py).toFixed(1));
    el.pedalFar.setAttribute('transform',  'translate(' + (2 * CRANK.x - px).toFixed(1) + ' ' + (2 * CRANK.y - py).toFixed(1) + ')');

    // 腿部 IK
    setLeg(el.nearLegPath, el.nearKnee, el.footNear, ang,     HIP);
    setLeg(el.farLegPath,  el.farKnee,  el.footFar,  ang + Math.PI, { x: 444, y: 299 });

    // 车身起伏 + 轻微侧倾（跟随踏频的二次谐波）
    var bob   = -Math.abs(Math.sin(ang)) * 4.5 - 1.5;
    var tilt  = Math.sin(ang * 2) * 0.55;
    el.rider.setAttribute('transform',
      'translate(0 ' + bob.toFixed(2) + ') rotate(' + tilt.toFixed(2) + ' 504 500)');

    // 头随路面轻微起伏
    el.headRig.setAttribute('transform',
      'rotate(' + (Math.sin(ang * 2 + 0.9) * 1.8).toFixed(2) + ' 476 250)');

    // 地面投影随离地高度缩放
    var s = 1 - bob * 0.016;
    el.shadow.setAttribute('transform',
      'translate(504 512) scale(' + s.toFixed(3) + ' ' + (1 - bob * 0.05).toFixed(3) + ') translate(-504 -512)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
