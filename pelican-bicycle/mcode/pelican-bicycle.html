<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  html,body{margin:0;padding:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#14212e;min-height:100vh;
  }
  svg{
    display:block;
    width:min(1100px,96vw);
    max-height:96vh;
    border-radius:18px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
  /* ---------- 视差滚动 ---------- */
  .strip{animation:slide linear infinite}
  .clouds{animation-duration:34s}
  .hillsB{animation-duration:58s}
  .hillsF{animation-duration:30s}
  @keyframes slide{to{transform:translateX(-800px)}}

  /* ---------- 车道虚线（向后滚动，营造前进感） ---------- */
  .lane{
    stroke-dasharray:36 30;
    animation:dash .17s linear infinite;
  }
  @keyframes dash{to{stroke-dashoffset:66}}

  /* ---------- 链条流动 ---------- */
  .chain{stroke-dasharray:6 4;animation:chainT .14s linear infinite}
  .chainB{animation-name:chainB}
  @keyframes chainT{to{stroke-dashoffset:-20}}
  @keyframes chainB{to{stroke-dashoffset:20}}

  /* ---------- 速度线 ---------- */
  .speed{stroke:#7fb8d9;stroke-width:5;stroke-linecap:round;opacity:0;
         animation:zoom .6s linear infinite}
  .sp2{animation-duration:.72s;animation-delay:.18s}
  .sp3{animation-duration:.55s;animation-delay:.34s}
  @keyframes zoom{
    0%{transform:translateX(0);opacity:0}
    15%{opacity:.75}
    100%{transform:translateX(-130px);opacity:0}
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="t d">
  <title id="t">鹈鹕骑自行车</title>
  <desc id="d">一只白色鹈鹕踩着一辆红色自行车向前飞驰的2D动画</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f0"/>
      <stop offset=".65" stop-color="#c8e9f8"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
  </defs>

  <!-- ===================== 背景 ===================== -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="95" cy="85" r="46" fill="#ffd60a" opacity=".25"/>
  <circle cx="95" cy="85" r="30" fill="#ffd60a"/>

  <!-- 云（视差） -->
  <g class="strip clouds">
    <g id="cloudset" fill="#ffffff" opacity=".92">
      <ellipse cx="140" cy="78" rx="40" ry="22"/>
      <ellipse cx="108" cy="86" rx="26" ry="15"/>
      <ellipse cx="170" cy="87" rx="25" ry="14"/>
      <ellipse cx="430" cy="140" rx="32" ry="17"/>
      <ellipse cx="405" cy="147" rx="20" ry="11"/>
      <ellipse cx="455" cy="148" rx="19" ry="11"/>
      <ellipse cx="660" cy="58" rx="44" ry="23"/>
      <ellipse cx="628" cy="66" rx="26" ry="14"/>
      <ellipse cx="694" cy="67" rx="25" ry="14"/>
    </g>
    <use href="#cloudset" x="800"/>
  </g>

  <!-- 远山（两层视差） -->
  <g class="strip hillsB">
    <path id="hillsBp" d="M0,378 Q120,286 250,358 Q330,402 460,324 Q560,270 680,354 Q740,392 800,358 L800,392 L0,392 Z" fill="#c9e4d0"/>
    <use href="#hillsBp" x="800"/>
  </g>
  <g class="strip hillsF">
    <path id="hillsFp" d="M0,382 Q80,328 190,374 Q300,412 430,350 Q545,308 655,376 Q735,408 800,370 L800,392 L0,392 Z" fill="#9ed5ae"/>
    <use href="#hillsFp" x="800"/>
  </g>

  <!-- 草地与公路 -->
  <rect x="0" y="372" width="800" height="15" fill="#74c69d"/>
  <rect x="0" y="385" width="800" height="65" fill="#52606d"/>
  <line x1="0" y1="389" x2="800" y2="389" stroke="#dfe5ea" stroke-width="2.5" opacity=".85"/>
  <line class="lane" x1="0" y1="422" x2="800" y2="422" stroke="#f8f9fa" stroke-width="6"/>

  <!-- 车轮投影 -->
  <ellipse cx="300" cy="389" rx="48" ry="6" fill="rgba(0,0,0,.16)"/>
  <ellipse cx="520" cy="389" rx="48" ry="6" fill="rgba(0,0,0,.16)"/>

  <!-- ===================== 自行车 ===================== -->
  <!-- 后轮 -->
  <g>
    <circle cx="300" cy="330" r="55" fill="none" stroke="#22333b" stroke-width="9"/>
    <circle cx="300" cy="330" r="46" fill="none" stroke="#8d99ae" stroke-width="3"/>
    <g stroke="#8d99ae" stroke-width="2.5">
      <line x1="256" y1="330" x2="344" y2="330"/>
      <line x1="268.9" y1="298.9" x2="331.1" y2="361.1"/>
      <line x1="300" y1="286" x2="300" y2="374"/>
      <line x1="268.9" y1="361.1" x2="331.1" y2="298.9"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 300 330" to="360 300 330" dur="0.85s" repeatCount="indefinite"/>
    </g>
    <circle cx="300" cy="330" r="5.5" fill="#415a77"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="520" cy="330" r="55" fill="none" stroke="#22333b" stroke-width="9"/>
    <circle cx="520" cy="330" r="46" fill="none" stroke="#8d99ae" stroke-width="3"/>
    <g stroke="#8d99ae" stroke-width="2.5">
      <line x1="476" y1="330" x2="564" y2="330"/>
      <line x1="488.9" y1="298.9" x2="551.1" y2="361.1"/>
      <line x1="520" y1="286" x2="520" y2="374"/>
      <line x1="488.9" y1="361.1" x2="551.1" y2="298.9"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 520 330" to="360 520 330" dur="0.85s" repeatCount="indefinite"/>
    </g>
    <circle cx="520" cy="330" r="5.5" fill="#415a77"/>
  </g>

  <!-- 远侧曲柄 + 脚踏（落后 180° 相位） -->
  <line x1="410" y1="335" x2="432" y2="335" stroke="#7a8291" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
      from="0 410 335" to="360 410 335" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
  </line>
  <g>
    <rect x="423" y="330.5" width="18" height="9" rx="2.5" fill="#5c6773"/>
    <animateMotion dur="1.2s" begin="-0.6s" repeatCount="indefinite"
      path="M432,335 A22,22 0 0 1 388,335 A22,22 0 0 1 432,335"/>
  </g>

  <!-- 远侧腿（IK 关键帧踩踏，深色） -->
  <polyline fill="none" stroke="#b9770e" stroke-width="6.5"
    stroke-linecap="round" stroke-linejoin="round" points="394,238 436.7,293.5 388,331">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite" values="
      394.0,238.0 436.7,293.5 388.0,331.0;
      394.0,238.0 443.5,287.5 390.9,320.0;
      394.0,238.0 451.0,278.6 399.0,311.9;
      394.0,238.0 456.7,269.2 410.0,309.0;
      394.0,238.0 458.9,264.3 421.0,311.9;
      394.0,238.0 457.8,266.8 429.1,320.0;
      394.0,238.0 453.6,274.7 432.0,331.0;
      394.0,238.0 446.4,284.4 429.1,342.0;
      394.0,238.0 438.1,292.4 421.0,350.1;
      394.0,238.0 431.9,296.9 410.0,353.0;
      394.0,238.0 430.0,298.0 399.0,350.1;
      394.0,238.0 431.9,296.8 390.9,342.0;
      394.0,238.0 436.7,293.5 388.0,331.0"/>
  </polyline>
  <polyline fill="none" stroke="#b9770e" stroke-width="5.5" stroke-linecap="round" points="388,331 405,330">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite" values="
      388.0,331.0 405.0,330.0;
      390.9,320.0 407.9,319.0;
      399.0,311.9 416.0,310.9;
      410.0,309.0 427.0,308.0;
      421.0,311.9 438.0,310.9;
      429.1,320.0 446.1,319.0;
      432.0,331.0 449.0,330.0;
      429.1,342.0 446.1,341.0;
      421.0,350.1 438.0,349.1;
      410.0,353.0 427.0,352.0;
      399.0,350.1 416.0,349.1;
      390.9,342.0 407.9,341.0;
      388.0,331.0 405.0,330.0"/>
  </polyline>

  <!-- 车架 -->
  <g>
    <path d="M300,330 L410,335 M300,330 L365,244 M410,335 L365,244
             M365,244 L527,247 M410,335 L533,252 M534,240 L520,330"
          fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
    <!-- 车把 -->
    <path d="M534,240 C535,231 536,226 539,221 Q542,214 533,213"
          fill="none" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
    <circle cx="533" cy="213" r="4" fill="#212529"/>
    <!-- 车座 -->
    <path d="M346,241 Q364,229 384,239 Q364,248 346,241 Z" fill="#212529"/>
    <line x1="365" y1="244" x2="364" y2="240" stroke="#495057" stroke-width="5"/>
    <!-- 飞轮 / 链条 / 牙盘 -->
    <circle cx="300" cy="330" r="7" fill="none" stroke="#495057" stroke-width="3"
            stroke-dasharray="2.5 2.5"/>
    <line class="chain"       x1="301" y1="323" x2="410" y2="320" stroke="#495057" stroke-width="3"/>
    <line class="chain chainB" x1="301" y1="337" x2="410" y2="350" stroke="#495057" stroke-width="3"/>
    <circle cx="410" cy="335" r="15.5" fill="#dee2e6" opacity=".55"/>
    <circle cx="410" cy="335" r="15.5" fill="none" stroke="#495057" stroke-width="3.5"
            stroke-dasharray="2.5 3"/>
  </g>

  <!-- 近侧曲柄 + 脚踏 -->
  <line x1="410" y1="335" x2="432" y2="335" stroke="#343a40" stroke-width="5.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
      from="0 410 335" to="360 410 335" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <g>
    <rect x="423" y="330.5" width="18" height="9" rx="2.5" fill="#212529"/>
    <animateMotion dur="1.2s" repeatCount="indefinite"
      path="M432,335 A22,22 0 0 1 388,335 A22,22 0 0 1 432,335"/>
  </g>

  <!-- 近侧腿（IK 关键帧踩踏） -->
  <polyline fill="none" stroke="#e9932f" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round" points="398,236 455.7,275.6 432,331">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite" values="
      398.0,236.0 455.7,275.6 432.0,331.0;
      398.0,236.0 448.1,284.9 429.1,342.0;
      398.0,236.0 439.1,292.7 421.0,350.1;
      398.0,236.0 432.3,297.0 410.0,353.0;
      398.0,236.0 430.2,298.2 399.0,350.1;
      398.0,236.0 432.2,297.1 390.9,342.0;
      398.0,236.0 437.2,294.0 388.0,331.0;
      398.0,236.0 444.2,288.6 390.9,320.0;
      398.0,236.0 452.2,280.3 399.0,311.9;
      398.0,236.0 458.5,271.2 410.0,309.0;
      398.0,236.0 461.2,266.1 421.0,311.9;
      398.0,236.0 460.2,268.1 429.1,320.0;
      398.0,236.0 455.7,275.6 432.0,331.0"/>
  </polyline>
  <polyline fill="none" stroke="#e9932f" stroke-width="6" stroke-linecap="round" points="432,331 449,330">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite" values="
      432.0,331.0 449.0,330.0;
      429.1,342.0 446.1,341.0;
      421.0,350.1 438.0,349.1;
      410.0,353.0 427.0,352.0;
      399.0,350.1 416.0,349.1;
      390.9,342.0 407.9,341.0;
      388.0,331.0 405.0,330.0;
      390.9,320.0 407.9,319.0;
      399.0,311.9 416.0,310.9;
      410.0,309.0 427.0,308.0;
      421.0,311.9 438.0,310.9;
      429.1,320.0 446.1,319.0;
      432.0,331.0 449.0,330.0"/>
  </polyline>

  <!-- ===================== 鹈鹕 ===================== -->
  <g>
    <!-- 上下起伏 -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 2.5;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <polygon points="314,190 276,172 288,190 270,204 290,212 314,218"
             fill="#f2ead8" stroke="#d8d2c0" stroke-width="2" stroke-linejoin="round"/>

    <!-- 身体 -->
    <ellipse cx="362" cy="202" rx="62" ry="42" transform="rotate(-8 362 202)"
             fill="#fffdf5" stroke="#ded5c2" stroke-width="2.5"/>

    <!-- 翅膀（轻拍） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 350 192;6 350 192;0 350 192" dur="1.2s" repeatCount="indefinite"/>
      <path d="M336,186 Q360,178 386,196 Q378,222 352,224 Q334,212 336,186 Z"
            fill="#f2ead8" stroke="#d8d2c0" stroke-width="2"/>
      <path d="M348,206 Q366,210 380,202 M346,196 Q362,200 378,192"
            fill="none" stroke="#ded5c2" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 脖子 -->
    <path d="M396,184 C420,178 426,158 427,142"
          fill="none" stroke="#fffdf5" stroke-width="24" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="429" cy="127" r="16.5" fill="#fffdf5" stroke="#ded5c2" stroke-width="2.5"/>
    <path d="M417,116 Q407,106 400,109 M420,112 Q413,102 406,105"
          fill="none" stroke="#ded5c2" stroke-width="3" stroke-linecap="round"/>

    <!-- 眼睛（会眨） -->
    <ellipse cx="433" cy="121" rx="3.4" ry="3.4" fill="#1d3557">
      <animate attributeName="ry" values="3.4;3.4;0.4;3.4"
               keyTimes="0;0.86;0.92;1" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="434.4" cy="119.6" r="1.1" fill="#ffffff"/>

    <!-- 大嘴 + 喉囊 -->
    <path d="M436,124 Q443,176 470,168 Q493,160 496,135 Q467,148 436,124 Z"
          fill="#ffb703" stroke="#e77f3f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M436,116 L499,127 L497,135 L435,126 Z"
          fill="#f4a261" stroke="#e77f3f" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="445" y1="120" x2="453" y2="121.5" stroke="#e77f3f" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 喉囊里的小鱼（扭动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 456,144;-9 456,144;0 456,144;7 456,144;0 456,144"
        dur="1s" repeatCount="indefinite"/>
      <polygon points="454,146 446,130 455,136 461,124 462,144"
               fill="#2a9d8f" stroke="#1d7d72" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- 翅膀搭在车把上 -->
    <path d="M398,208 Q470,196 531,214" fill="none"
          stroke="#e9932f" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 速度线 -->
  <line class="speed"    x1="210" y1="152" x2="262" y2="152"/>
  <line class="speed sp2" x1="176" y1="186" x2="244" y2="186"/>
  <line class="speed sp3" x1="200" y1="224" x2="258" y2="224"/>
</svg>
</body>
</html>
